<!doctype html>
<!-- Hand-written fixture: a shop which only marks its product image with microdata, and repeats the title as description. -->
<html>
<head>
    <title>Desk Lamp</title>
    <meta name="description" content="Desk Lamp">
    <link rel="icon" href="/favicon.png">
</head>
<body itemscope itemtype="https://schema.org/Product">
    <h1 itemprop="name">Desk Lamp</h1>
    <img itemprop="image" src="/images/lamp.jpg" alt="Desk Lamp">
    <div itemprop="offers" itemscope itemtype="https://schema.org/Offer">
        <span itemprop="price" content="19,99">19,99 €</span>
        <meta itemprop="priceCurrency" content="EUR">
    </div>
</body>
</html>
