<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 1264" class="wish-diagram" role="img" aria-labelledby="t-124225637777472">
<title id="t-124225637777472">Out of stock: undo it</title>
<style>.wish-diagram{font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif}
.wish-diagram .canvas{fill:#ffffff}
.wish-diagram text{fill:#1d1f24}
.wish-diagram .title{font-size:21px;font-weight:700}
.wish-diagram .body{font-size:18px}
.wish-diagram .b{font-weight:700}
.wish-diagram .hdr-t{font-size:22px;font-weight:700}
.wish-diagram .band{stroke:#4a4f58;stroke-width:1.5;stroke-dasharray:4 6}
.wish-diagram .pill{fill:#ffffff;stroke:#4a4f58;stroke-width:1.5}
.wish-diagram .band-t,.wish-diagram .edge-t{font-size:17px;font-weight:700}
.wish-diagram .edge{fill:none;stroke:#4a4f58;stroke-width:2.5}
.wish-diagram .arrowhead{fill:#4a4f58}
.wish-diagram .badge-t{font-size:19px;font-weight:700;fill:#ffffff}
.wish-diagram .k-bob .box,.wish-diagram .k-bob .hdr{fill:#e8f0fb;stroke:#2f5f9e;stroke-width:2.5}
.wish-diagram .k-bob .badge{fill:#2f5f9e}
.wish-diagram .k-alice .box,.wish-diagram .k-alice .hdr{fill:#f3eafa;stroke:#7a3f9d;stroke-width:2.5}
.wish-diagram .k-alice .badge{fill:#7a3f9d}
.wish-diagram .k-result .box,.wish-diagram .k-result .hdr{fill:#e6f4ea;stroke:#2e7d4f;stroke-width:2.5}
.wish-diagram .k-result .badge{fill:#2e7d4f}
.wish-diagram .k-warn .box,.wish-diagram .k-warn .hdr{fill:#fdeee4;stroke:#b5522b;stroke-width:2.5}
.wish-diagram .k-warn .badge{fill:#b5522b}
.wish-diagram .k-note .box,.wish-diagram .k-note .hdr{fill:#fff6cc;stroke:#9a7800;stroke-width:2.5}
.wish-diagram .k-note .badge{fill:#9a7800}
.wish-diagram .k-start .box,.wish-diagram .k-start .hdr{fill:#f1f1ef;stroke:#77736a;stroke-width:2.5}
.wish-diagram .k-start .badge{fill:#77736a}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="canvas" x="0" y="0" width="940" height="1264"/>
<g class="k-alice"><rect class="hdr" x="40" y="24" width="380" height="56" rx="28"/><text class="hdr-t" x="230.0" y="60" text-anchor="middle">Alice</text></g>
<g class="k-note"><rect class="hdr" x="520" y="24" width="380" height="56" rx="28"/><text class="hdr-t" x="710.0" y="60" text-anchor="middle">Good to know</text></g>
<path class="edge" d="M230,216 L230,276" marker-end="url(#arrow)"/>
<path class="edge" d="M230,404 L230,440" marker-end="url(#arrow)"/>
<path class="edge" d="M230,568 L230,604" marker-end="url(#arrow)"/>
<path class="edge" d="M230,732 L230,768" marker-end="url(#arrow)"/>
<path class="edge" d="M230,896 L230,932" marker-end="url(#arrow)"/>
<path class="edge" d="M230,1060 L230,1096" marker-end="url(#arrow)"/>
<g class="k-start"><rect class="box" x="40" y="112" width="380" height="104" rx="14" stroke-dasharray="7 5"/>
<text class="title" x="60" y="148">Earlier</text>
<text class="body" x="60" y="177" xml:space="preserve">Alice clicked <tspan class="b">Fulfil wish </tspan>on one</text>
<text class="body" x="60" y="201" xml:space="preserve">of Bob’s wishes.</text>
</g>
<g class="k-warn"><rect class="box" x="40" y="276" width="380" height="128" rx="14"/>
<circle class="badge" cx="70" cy="308" r="17"/><text class="badge-t" x="70" y="315" text-anchor="middle">!</text>
<text class="title" x="98" y="312">Bad news from the store</text>
<text class="body" x="98" y="341" xml:space="preserve">It is out of stock. There will</text>
<text class="body" x="98" y="365" xml:space="preserve">be no more for three months.</text>
</g>
<g class="k-alice"><rect class="box" x="40" y="440" width="380" height="128" rx="14"/>
<circle class="badge" cx="70" cy="472" r="17"/><text class="badge-t" x="70" y="479" text-anchor="middle">1</text>
<text class="title" x="98" y="476">Open your gifts</text>
<text class="body" x="98" y="505" xml:space="preserve">In the menu, click <tspan class="b">Wishlists</tspan>,</text>
<text class="body" x="98" y="529" xml:space="preserve">then <tspan class="b">My gifts</tspan>.</text>
</g>
<g class="k-alice"><rect class="box" x="40" y="604" width="380" height="128" rx="14"/>
<circle class="badge" cx="70" cy="636" r="17"/><text class="badge-t" x="70" y="643" text-anchor="middle">2</text>
<text class="title" x="98" y="640">Find the gift</text>
<text class="body" x="98" y="669" xml:space="preserve">Find the row with the wish.</text>
<text class="body" x="98" y="693" xml:space="preserve">The <tspan class="b">For </tspan>column says Bob.</text>
</g>
<g class="k-alice"><rect class="box" x="40" y="768" width="380" height="128" rx="14"/>
<circle class="badge" cx="70" cy="800" r="17"/><text class="badge-t" x="70" y="807" text-anchor="middle">3</text>
<text class="title" x="98" y="804">Undo it</text>
<text class="body" x="98" y="833" xml:space="preserve">Click <tspan class="b">Undo</tspan>. You see: “The wish</text>
<text class="body" x="98" y="857" xml:space="preserve">is available again.”</text>
</g>
<g class="k-result"><rect class="box" x="40" y="932" width="380" height="128" rx="14"/>
<circle class="badge" cx="70" cy="964" r="17"/><text class="badge-t" x="70" y="971" text-anchor="middle">✓</text>
<text class="title" x="98" y="968">Back on the list</text>
<text class="body" x="98" y="997" xml:space="preserve">The wish is back on Bob’s</text>
<text class="body" x="98" y="1021" xml:space="preserve">list, for everyone to see.</text>
</g>
<g class="k-alice"><rect class="box" x="40" y="1096" width="380" height="128" rx="14"/>
<circle class="badge" cx="70" cy="1128" r="17"/><text class="badge-t" x="70" y="1135" text-anchor="middle">4</text>
<text class="title" x="98" y="1132">Pick another wish</text>
<text class="body" x="98" y="1161" xml:space="preserve">Open Bob’s list again and</text>
<text class="body" x="98" y="1185" xml:space="preserve">click <tspan class="b">Details </tspan>on a different</text>
<text class="body" x="98" y="1209" xml:space="preserve">wish. (Giving a wish, step 4.)</text>
</g>
<g class="k-note"><rect class="box" x="520" y="440" width="380" height="128" rx="14" stroke-dasharray="7 5"/>
<circle class="badge" cx="550" cy="472" r="17"/><text class="badge-t" x="550" y="479" text-anchor="middle">!</text>
<text class="title" x="578" y="476">Shortcut</text>
<text class="body" x="578" y="505" xml:space="preserve">Still see the “Thank you!”</text>
<text class="body" x="578" y="529" xml:space="preserve">message? Click its <tspan class="b">Undo </tspan>button</text>
<text class="body" x="578" y="553" xml:space="preserve">instead.</text>
</g>
<g class="k-note"><rect class="box" x="520" y="768" width="380" height="128" rx="14" stroke-dasharray="7 5"/>
<circle class="badge" cx="550" cy="800" r="17"/><text class="badge-t" x="550" y="807" text-anchor="middle">!</text>
<text class="title" x="578" y="804">Do it soon</text>
<text class="body" x="578" y="833" xml:space="preserve"><tspan class="b">Undo </tspan>works for 60 minutes</text>
<text class="body" x="578" y="857" xml:space="preserve">after clicking <tspan class="b">Fulfil wish</tspan>.</text>
</g>
<g class="k-bob"><rect class="box" x="520" y="932" width="380" height="128" rx="14"/>
<circle class="badge" cx="550" cy="964" r="17"/><text class="badge-t" x="550" y="971" text-anchor="middle">B</text>
<text class="title" x="578" y="968">Bob’s view</text>
<text class="body" x="578" y="997" xml:space="preserve">Nothing changes for Bob. The</text>
<text class="body" x="578" y="1021" xml:space="preserve">wish stayed on his list the</text>
<text class="body" x="578" y="1045" xml:space="preserve">whole time.</text>
</g>
</svg>
